name: Build desktop release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  # electron-builder writes installers here (not dist/ — dist is Vite output only).
  EB_OUTPUT: release

jobs:
  # Tags must land on main (never cut a release from an unmerged dev tip).
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure tag commit is on main
        run: |
          set -euo pipefail
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME is not on main."
            echo "Merge a PR from dev → main, then tag that merge commit."
            exit 1
          fi
          echo "OK: $GITHUB_SHA is on origin/main"

  windows:
    needs: [guard]
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches package.json version
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag version ($TAG) must match package.json version ($PKG)."
            echo "Bump package.json, commit, then tag v\$PKG."
            exit 1
          fi

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run check

      - name: Build Windows release files
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          test -f dist-electron/electron/main.js
          test -f dist-electron/electron/macos.js
          # Missing secrets become empty env vars; electron-builder treats empty
          # CSC_LINK as a cert path and fails with "<cwd> not a file".
          if [ -z "${CSC_LINK:-}" ]; then
            unset CSC_LINK CSC_KEY_PASSWORD WIN_CSC_LINK WIN_CSC_KEY_PASSWORD
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          npx electron-builder --win --publish never
        env:
          # Optional: base64 .pfx for SmartScreen-friendly updates.
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      - name: Verify packaged Windows asar
        shell: bash
        run: |
          RESOURCES="$(find release/win-unpacked -type d -name resources | head -1)"
          if [ -z "$RESOURCES" ]; then
            echo "win-unpacked resources not found"
            ls -la release || true
            exit 1
          fi
          node scripts/verify-packaged-app.mjs "$RESOURCES"
          # Stable names → site deep-links /releases/latest/download/…
          ls -la release/Lamp-Light-Setup.exe release/latest.yml

      - name: Upload Windows assets
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            release/Lamp-Light-Setup.exe
            release/Lamp-Light-Setup.exe.blockmap
            release/latest.yml
          if-no-files-found: error

  macos:
    needs: [guard]
    runs-on: macos-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches package.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag version ($TAG) must match package.json version ($PKG)."
            exit 1
          fi

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run check

      - name: Install Developer ID certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.MAC_CSC_LINK }}
          CERTIFICATE_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${CERTIFICATE_BASE64:-}" ] || [ -z "${CERTIFICATE_PASSWORD:-}" ] || [ -z "${KEYCHAIN_PASSWORD:-}" ]; then
            echo "Signing secrets missing — Mac build will be unsigned."
            echo "SKIP_SIGNING=1" >> "$GITHUB_ENV"
            exit 0
          fi
          CERTIFICATE_PATH="$RUNNER_TEMP/developer-id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/lamp-light-signing.keychain-db"
          printf '%s' "$CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -P "$CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed s/\"//g)
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"
          rm -f "$CERTIFICATE_PATH"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "SKIP_SIGNING=0" >> "$GITHUB_ENV"

      - name: Build macOS release files
        run: |
          set -euo pipefail
          npm run build
          test -f dist-electron/electron/main.js
          test -f dist-electron/electron/macos.js
          # Prefer identity already imported into the runner keychain.
          # Do not set CSC_LINK here — electron-builder's temp-keychain path
          # fails on GHA with set-key-partition-list.
          unset CSC_LINK CSC_KEY_PASSWORD || true
          if [ "${SKIP_SIGNING:-1}" = "1" ]; then
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            echo "Apple notarization secrets missing — shipping unsigned/notarize-skipped build"
            npx electron-builder --mac --x64 --arm64 --publish never
          else
            export CSC_IDENTITY_AUTO_DISCOVERY=true
            export CSC_NAME="Lionel Tchami Nfada (UD43QCFHR4)"
            if [ -n "${APPLE_ID:-}" ] && [ -n "${APPLE_APP_SPECIFIC_PASSWORD:-}" ] && [ -n "${APPLE_TEAM_ID:-}" ]; then
              echo "Apple notarization credentials detected — enabling mac.notarize"
              npx electron-builder --mac --x64 --arm64 --publish never -c.mac.notarize=true
            else
              echo "Signing only — notarization secrets incomplete"
              npx electron-builder --mac --x64 --arm64 --publish never
            fi
          fi
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Verify packaged macOS apps (arm64 + x64)
        run: |
          set -euo pipefail
          node scripts/verify-packaged-app.mjs "release/mac-arm64/Lamp Light.app"
          node scripts/verify-packaged-app.mjs "release/mac/Lamp Light.app"
          # Stable names → site deep-links /releases/latest/download/…
          ls -la release/Lamp-Light-arm64.dmg release/Lamp-Light-x64.dmg
          ls -la release/Lamp-Light-arm64.zip release/Lamp-Light-x64.zip
          ls -la release/latest-mac.yml

      - name: Upload macOS assets
        uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: |
            release/Lamp-Light-arm64.dmg
            release/Lamp-Light-arm64.dmg.blockmap
            release/Lamp-Light-x64.dmg
            release/Lamp-Light-x64.dmg.blockmap
            release/Lamp-Light-arm64.zip
            release/Lamp-Light-arm64.zip.blockmap
            release/Lamp-Light-x64.zip
            release/Lamp-Light-x64.zip.blockmap
            release/latest-mac.yml
          if-no-files-found: error

  release:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: List assets
        run: |
          set -euo pipefail
          ls -lah release-assets
          # electron-updater + installers expected on every release.
          test -f release-assets/latest.yml
          test -f release-assets/latest-mac.yml
          ls release-assets/Lamp-Light-Setup.exe >/dev/null
          ls release-assets/Lamp-Light-arm64.dmg >/dev/null
          ls release-assets/Lamp-Light-x64.dmg >/dev/null
          ls release-assets/Lamp-Light-arm64.zip >/dev/null
          ls release-assets/Lamp-Light-x64.zip >/dev/null

      - name: Publish GitHub release
        run: |
          set -euo pipefail
          # electron-updater needs latest.yml / latest-mac.yml on the GitHub Release.
          NOTES="$(cat <<EOF
          ## Lamp & Light ${GITHUB_REF_NAME#v}

          Offline-first Bible trivia, reading, and practice for your desktop.

          ### In this lineage
          - macOS menu, About panel, dock reopen, keyboard shortcuts
          - Daily reminder notifications + dock badge
          - Custom profile photo + expanded biblical avatars
          - Share Verse of the Day and reader verses

          Auto-update uses the Mac \`.zip\` / Windows \`.exe\` with \`latest-mac.yml\` / \`latest.yml\`.
          EOF
          )"
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-assets/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" release-assets/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "Lamp & Light ${GITHUB_REF_NAME#v}" \
              --notes "$NOTES"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  homebrew:
    needs: [release]
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Update Homebrew tap cask
        env:
          HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${HOMEBREW_TAP_DEPLOY_KEY:-}" ]; then
            echo "HOMEBREW_TAP_DEPLOY_KEY missing — skip Homebrew tap update"
            exit 0
          fi
          VERSION="${GITHUB_REF_NAME#v}"
          TMP="$(mktemp -d)"
          curl -fsSL -o "$TMP/Lamp-Light-arm64.dmg" \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/Lamp-Light-arm64.dmg"
          curl -fsSL -o "$TMP/Lamp-Light-x64.dmg" \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/Lamp-Light-x64.dmg"
          ARM_SHA="$(sha256sum "$TMP/Lamp-Light-arm64.dmg" | awk '{print $1}')"
          INTEL_SHA="$(sha256sum "$TMP/Lamp-Light-x64.dmg" | awk '{print $1}')"
          echo "arm64=$ARM_SHA"
          echo "intel=$INTEL_SHA"
          bash scripts/update-homebrew-cask.sh "$VERSION" "$ARM_SHA" "$INTEL_SHA"
