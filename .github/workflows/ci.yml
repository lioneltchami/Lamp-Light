name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run check

      - name: Compile Electron + Vite (packaging inputs)
        run: npm run build

      - name: Verify committed preload.cjs is not stale
        run: |
          set -euo pipefail
          # electron/preload.cjs is generated from electron/preload.ts and is
          # committed to git (it ships inside the asar). `npm run build` above
          # already regenerated it, so any diff here means the committed file
          # is out of sync with the TypeScript source.
          if ! git diff --exit-code -- electron/preload.cjs; then
            echo "::error file=electron/preload.cjs::electron/preload.cjs is out of sync with electron/preload.ts. Run 'npm run gen:preload' and commit the result."
            git --no-pager diff -- electron/preload.cjs
            exit 1
          fi
          echo "OK: electron/preload.cjs matches electron/preload.ts"

      - name: Smoke-check built Electron bundle
        run: |
          set -euo pipefail
          test -f dist-electron/electron/main.js
          test -f dist-electron/electron/macos.js
          test -f dist-electron/electron/migrations.js
          test -f electron/preload.cjs
          test -f dist/index.html
          node -e "
            const fs = require('fs');
            const main = fs.readFileSync('dist-electron/electron/main.js','utf8');
            const preload = fs.readFileSync('electron/preload.cjs','utf8');
            const macos = fs.readFileSync('dist-electron/electron/macos.js','utf8');
            const mig = fs.readFileSync('dist-electron/electron/migrations.js','utf8');
            for (const [label, hay, needle] of [
              ['main', main, 'profile:custom-avatar'],
              ['main', main, 'reminder:get'],
              ['main', main, 'createMainWindow'],
              ['main', main, 'installApplicationMenu'],
              ['preload', preload, 'onNavigate'],
              ['preload', preload, 'onShareVotd'],
              ['macos', macos, 'configureAboutPanel'],
              ['macos', macos, 'refreshDockBadge'],
              ['migrations', mig, 'custom_avatar_path'],
            ]) {
              if (!hay.includes(needle)) {
                console.error('FAIL: ' + label + ' missing ' + needle);
                process.exit(1);
              }
            }
            const pkg = require('./package.json');
            if (pkg.build?.mac?.extendInfo?.NSUserNotificationUsageDescription == null) {
              console.error('FAIL: package.json mac.extendInfo missing NSUserNotificationUsageDescription');
              process.exit(1);
            }
            if (pkg.build?.productName !== 'Lamp & Light') {
              console.error('FAIL: productName must be Lamp & Light');
              process.exit(1);
            }
            console.log('OK: built bundle includes current desktop features');
          "
